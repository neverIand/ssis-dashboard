  /api/v1/metrics/timeline:
    get:
      operationId: getTimeline
      summary: Zero-filled timezone-aware creation buckets
      description: Implemented in C3c. Apply selected statuses before buckets; current status is not a historical
        reconstruction. Return contiguous UTC bucket boundaries from the configured IANA timezone, including DST folds
        and partial hours. Count only executions inside the effective creation bounds; preserve zero buckets.
      x-implementation-status: implemented
      x-milestone: C3c
      parameters:
      - {$ref: '#/components/parameters/Folder'}
      - {$ref: '#/components/parameters/Project'}
      - {$ref: '#/components/parameters/FolderPattern'}
      - {$ref: '#/components/parameters/ProjectPattern'}
      - {$ref: '#/components/parameters/From'}
      - {$ref: '#/components/parameters/To'}
      - {$ref: '#/components/parameters/Status'}
      - {$ref: '#/components/parameters/Bucket'}
