components:
  schemas:
    Id: {type: string, maxLength: 19, pattern: '^([1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$',
      description: Positive SQL BIGINT decimal string; numeric value <= 9223372036854775807. Never a floating-point
        number.}
    Lsn: {type: string, maxLength: 19, pattern: '^(0|([1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807))$',
      description: 'Nonnegative SQL BIGINT decimal string, <= 9223372036854775807; not a sequential counter.'}
    UtcTimestamp: {type: string, maxLength: 28, format: date-time, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-5][0-9](\.[0-9]{1,7})?Z$',
      description: 'UTC RFC 3339; preserve up to seven fractional digits, including SQL''s seventh digit when present.'}
    InputTimestamp:
      type: string
      maxLength: 33
      format: date-time
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-5][0-9](\.[0-9]{1,7})?(Z|[+-]((0[0-9]|1[0-3]):[0-5][0-9]|14:00))$
      description: Valid offset-aware instant, offset at most +/-14:00; uppercase T/Z, no unknown -00:00 offset
        or leap seconds. Semantic date/range checks also apply.
      not: {pattern: '-00:00$'}
    RequestId: {type: string, maxLength: 32, pattern: '^[0-9a-f]{32}$'}
    Name128: {type: string, maxLength: 128, minLength: 1, x-sql-max-utf16-units: 128}
    PackageName: {type: string, maxLength: 260, minLength: 1, x-sql-max-utf16-units: 260}
    Path: {type: string, maxLength: 16384, description: 'Original catalog path, never interpreted as a filesystem
        or URL path.'}
    Cursor: {type: string, maxLength: 8192, minLength: 1, pattern: '^[A-Za-z0-9_.-]+$', description: Opaque authenticated
        paging token; 30-minute non-sliding lifetime. Never authorization.}
    StatusSelection:
      type: array
      items:
        type: integer
        enum: [1, 2, 3, 4, 5, 6, 7, 8, 9]
      maxItems: 9
      minItems: 1
      uniqueItems: true
    ExecutionStatus:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {type: integer, minimum: -2147483648, maximum: 2147483647}
        name:
          type: string
          enum: [created, running, cancelled, failed, pending, halted, succeeded, stopping, completed, unknown]
    LoggingLevel:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {type: integer}
        name:
          type: string
          enum: [none, basic, performance, verbose, runtime-lineage, custom, unknown]
    ExecutableResult:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {type: integer, minimum: -32768, maximum: 32767}
        name:
          type: string
          enum: [success, failure, completion, cancelled, unknown]
    ParameterObjectType:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {type: integer, minimum: -32768, maximum: 32767}
        name:
          type: string
          enum: [project, package, system, unknown]
    Environment:
      type: object
      additionalProperties: false
      required: [folder_name, name]
      properties:
        folder_name:
          anyOf:
          - {$ref: '#/components/schemas/Name128'}
          - {type: 'null'}
        name:
          anyOf:
          - {$ref: '#/components/schemas/Name128'}
          - {type: 'null'}
    EventCounts:
      type: object
      additionalProperties: false
      required: [all, errors, warnings, duplicate_warnings, memory_warnings]
      properties:
        all: {type: integer, minimum: 0, maximum: 9007199254740991}
        errors: {type: integer, minimum: 0, maximum: 9007199254740991}
        warnings: {type: integer, minimum: 0, maximum: 9007199254740991}
        duplicate_warnings: {type: integer, minimum: 0, maximum: 9007199254740991}
        memory_warnings: {type: integer, minimum: 0, maximum: 9007199254740991}
      description: Counts of visible recorded messages. All includes other/unknown kinds; duplicate warnings are
        a subset of warnings. Heuristics use full source text and catalog collation; zero does not prove no event occurred.
    Capabilities:
      type: object
      additionalProperties: false
      required: [events, values, override_values]
      properties:
        events: {type: boolean}
        values: {type: boolean}
        override_values: {type: boolean}
      allOf:
      - if:
          properties:
            override_values: {const: true}
          required: [override_values]
        then:
          properties:
            values: {const: true}
    Limits:
      type: object
      additionalProperties: false
      required: [default_limit, max_limit, default_range_hours, max_range_hours, max_timeline_buckets, cursor_ttl_seconds,
        max_cursor_characters, max_text_characters, max_search_characters]
      properties:
        default_limit: {type: integer, const: 50}
        max_limit: {type: integer, const: 200}
