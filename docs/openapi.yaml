        '504': {$ref: '#/components/responses/DatabaseTimeout'}
  /api/v1/executions/{id}/children:
    get:
      operationId: listChildren
      summary: Bounded child invocation observations within parent execution
      description: PLANNED; not implemented. Use path/source/occurrence matching; incomplete observations retain
        NULL end/duration. Children share the parent's execution ID.
      x-implementation-status: planned
      x-milestone: C4c
      parameters:
      - {$ref: '#/components/parameters/ExecutionId'}
