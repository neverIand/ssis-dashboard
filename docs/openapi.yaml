        '400': {$ref: '#/components/responses/BadRequest'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '504': {$ref: '#/components/responses/DatabaseTimeout'}
  /api/v1/metrics/summary:
    get:
      operationId: getSummary
      summary: All-status counts in the created-time cohort
      description: Implemented in C3b. Accept and validate status for shared filter URLs, but intentionally count all statuses.
        Reuse explicit creation bounds from execution pages. Known codes are zero-filled; observed unknown codes remain separate.
      x-implementation-status: implemented
      x-milestone: C3b
      parameters:
      - {$ref: '#/components/parameters/Folder'}
      - {$ref: '#/components/parameters/Project'}
      - {$ref: '#/components/parameters/FolderPattern'}
      - {$ref: '#/components/parameters/ProjectPattern'}
      - {$ref: '#/components/parameters/From'}
      - {$ref: '#/components/parameters/To'}
      - {$ref: '#/components/parameters/Status'}
