        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '504': {$ref: '#/components/responses/DatabaseTimeout'}
  /api/v1/executions/{id}/events:
    get:
      operationId: listEvents
      summary: Paged category/search results across full matching event text
      description: PLANNED; not implemented. Disabled by default; deny before SQL. Literal full-message search precedes
        paging/display truncation. No exact total required.
      x-implementation-status: planned
      x-milestone: C5
      parameters:
      - {$ref: '#/components/parameters/ExecutionId'}
