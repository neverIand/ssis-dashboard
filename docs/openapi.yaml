  parameters:
    Folder:
      name: folder
      in: query
      required: false
      description: Exact folder name; mutually exclusive with folder_pattern.
      schema: {$ref: '#/components/schemas/Name128'}
    RequiredFolder:
      name: folder
      in: query
      required: true
      description: Exact folder name, required.
      schema: {$ref: '#/components/schemas/Name128'}
    Project:
      name: project
      in: query
      required: false
      description: Exact project name; mutually exclusive with project_pattern.
      schema: {$ref: '#/components/schemas/Name128'}
    RequiredProject:
      name: project
      in: query
      required: true
      description: Exact project name, required.
      schema: {$ref: '#/components/schemas/Name128'}
    RequiredPackage:
      name: package
      in: query
      required: true
      description: Exact package name, required.
      schema: {$ref: '#/components/schemas/PackageName'}
    FolderPattern:
      name: folder_pattern
      in: query
      required: false
      description: 'Explicit glob: * matches any sequence; \* is literal *, \\ is literal backslash. SQL wildcard
        characters are escaped, not interpreted.'
      schema: {type: string, maxLength: 512, minLength: 1, x-sql-max-utf16-units: 512}
    ProjectPattern:
      name: project_pattern
      in: query
      required: false
      description: 'Explicit glob: * matches any sequence; \* is literal *, \\ is literal backslash. SQL wildcard
        characters are escaped, not interpreted.'
      schema: {type: string, maxLength: 512, minLength: 1, x-sql-max-utf16-units: 512}
    From:
      name: from
      in: query
      required: false
      description: Inclusive created_time lower bound; default effective to minus HOUR_SPAN (360 hours). Required
        explicitly when continuing a windowed cursor.
      schema: {$ref: '#/components/schemas/InputTimestamp'}
    To:
      name: to
      in: query
      required: false
      description: Exclusive created_time upper bound; resolved once from request clock or fixed AS_OF_DATE. Required
        explicitly on cursor continuation.
      schema: {$ref: '#/components/schemas/InputTimestamp'}
    Status:
      name: status
      in: query
      required: false
      description: Comma-separated known codes 1-9, no duplicates/spaces. Omitted means all, including future catalog
        codes.
      schema: {$ref: '#/components/schemas/StatusSelection'}
      style: form
      explode: false
    HistoryStatus:
      name: status
      in: query
      required: false
      description: Comma-separated known codes; default running/succeeded (2,7).
      schema:
        $ref: '#/components/schemas/StatusSelection'
        default: [2, 7]
      style: form
      explode: false
    Limit:
      name: limit
      in: query
      required: false
      description: Bounded page size; repeat original effective value on continuation.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque next cursor; repeat other selectors and explicit effective time bounds. Filter/direction/limit/scope
        mismatch is 400.
      schema: {$ref: '#/components/schemas/Cursor'}
    Direction:
      name: direction
      in: query
      required: false
      description: Sort direction; changing it starts a new cursor session.
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    AscendingDirection:
      name: direction
      in: query
      required: false
      description: Sort direction; changing it starts a new cursor session.
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    ExecutionSort:
      name: sort
      in: query
      required: false
      description: Global order across the matching cohort; NULLs last in both directions and execution ID follows
        the selected direction for ties. Environment compares folder then name with NULLs last for each component.
        Duration uses actual end minus start and remains NULL without both; cursor keys preserve exact SQL ticks.
      schema:
        type: string
        enum: [execution_id, created_at, started_at, ended_at, project_name, package_name, environment, status,
          logging_level, duration_seconds, warning_count, error_count]
        default: execution_id
    FolderSort:
      name: sort
      in: query
      required: false
      description: Catalog name order with a same-direction folder-ID tie-breaker, or folder ID alone. Names are non-NULL.
      schema:
        type: string
        enum: [name, folder_id]
        default: name
    ProjectSort:
      name: sort
      in: query
      required: false
      description: Catalog name order with a same-direction project-ID tie-breaker, or project ID alone. Names are non-NULL.
      schema:
        type: string
        enum: [name, project_id]
        default: name
    ExecutableSort:
      name: sort
      in: query
      required: false
      description: Global allowlisted order with unique-ID tie-breaker; NULLs last. C2a supports execution_id only;
        other execution sorts are C2b.
      schema:
        type: string
        enum: [started_at, statistics_id]
        default: started_at
    ChildSort:
      name: sort
      in: query
      required: false
      description: Global allowlisted order with unique-ID tie-breaker; NULLs last. C2a supports execution_id only;
        other execution sorts are C2b.
      schema:
        type: string
        enum: [started_at, observation_id]
        default: started_at
    EventSort:
      name: sort
      in: query
      required: false
      description: Global allowlisted order with unique-ID tie-breaker; NULLs last. C2a supports execution_id only;
        other execution sorts are C2b.
      schema:
        type: string
        enum: [message_time, event_id]
        default: message_time
    HistorySort:
      name: sort
      in: query
      required: false
      description: Global allowlisted order with unique-ID tie-breaker; NULLs last. C2a supports execution_id only;
        other execution sorts are C2b.
      schema:
        type: string
        enum: [execution_id]
        default: execution_id
    EventKind:
      name: kind
      in: query
      required: false
      description: Category before search/paging; duplicate/memory categories retain documented legacy substring
        heuristics.
      schema:
        type: string
        enum: [all, errors, warnings, duplicate-warnings, memory-warnings]
        default: all
    Search:
      name: q
      in: query
      required: false
      description: Literal full-message substring, catalog collation; escape LIKE wildcards. Bound before paging,
        even for truncated display text.
      schema: {type: string, maxLength: 512, minLength: 1, x-sql-max-utf16-units: 1024}
    Bucket:
      name: bucket
      in: query
      required: false
      description: Display-timezone calendar buckets, zero filled; configured cap may be lowered but never exceeds
        1000.
      schema:
        type: string
        enum: [day, hour]
        default: day
    Section:
      name: section
      in: query
      required: false
      description: One bounded values section; fixed ascending execution_parameter_id/property_id order, each with
        its own query/cursor. Override values are policy-redacted by default.
      schema:
        type: string
        enum: [parameters, overrides]
        default: parameters
    ExecutionId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
      description: Positive SQL BIGINT string; absent and hidden IDs share the same 404. Zero is invalid.
