        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '504': {$ref: '#/components/responses/DatabaseTimeout'}
  /api/v1/executions/{id}/executables:
    get:
      operationId: listExecutables
      summary: Bounded executable observations
      description: PLANNED; not implemented.
      x-implementation-status: planned
      x-milestone: C4b
      parameters:
      - {$ref: '#/components/parameters/ExecutionId'}
      - {$ref: '#/components/parameters/Limit'}
