  /api/v1/history:
    get:
      operationId: listHistory
      summary: Exact package history with separate estimates
      description: PLANNED; not implemented. Default last 50 running/succeeded; no implicit dashboard time range.
        C7a returns estimate NULL; C7b adds prior-five-successful mean with no future samples.
      x-implementation-status: planned
      x-milestone: C7a/C7b
