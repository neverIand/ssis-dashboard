  /readyz:
    get:
      operationId: getReadiness
      summary: One bounded read-only dependency check
      description: Implemented in C1c. One zero-row catalog read with two-second positive driver login/query caps
        each by default, reduced by lower global timeouts; not a two-second total HTTP deadline. No connection or identity diagnostics.
