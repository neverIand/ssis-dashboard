  /api/v1/executions/{id}/values:
    get:
      operationId: listValues
      summary: One bounded parameter or property-override section
      description: PLANNED; not implemented. Disabled by default; deny before SQL. Fixed ascending ID/path order
        per section. Override values default to NULL/policy-redacted; sensitive values always redacted.
      x-implementation-status: planned
      x-milestone: C6
