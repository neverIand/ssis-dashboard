        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '504': {$ref: '#/components/responses/DatabaseTimeout'}
  /api/v1/executions:
    get:
      operationId: listExecutions
      summary: Bounded execution page with recorded event counts
      description: Implemented in C2a/C2b with global allowlisted sorts, NULLs last and a same-direction ID tie-breaker.
        Use created_time bounds, an upper ID and authenticated filter/sort-bound keyset cursors; no database snapshot.
      x-implementation-status: implemented
      x-milestone: C2a/C2b
      parameters:
      - {$ref: '#/components/parameters/Folder'}
      - {$ref: '#/components/parameters/Project'}
      - {$ref: '#/components/parameters/FolderPattern'}
      - {$ref: '#/components/parameters/ProjectPattern'}
      - {$ref: '#/components/parameters/From'}
      - {$ref: '#/components/parameters/To'}
      - {$ref: '#/components/parameters/Status'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/ExecutionSort'}
      - {$ref: '#/components/parameters/Direction'}
