        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '504': {$ref: '#/components/responses/DatabaseTimeout'}
  /api/v1/executions/{id}:
    get:
      operationId: getExecution
      summary: Visible execution identity, actual timings and event counts
      description: Implemented in C4a. Independent of overview filters. Absent and hidden IDs return indistinguishable
        safe 404 before event work; aggregation rechecks visibility and returns only recorded counts.
      x-implementation-status: implemented
      x-milestone: C4a
      parameters:
