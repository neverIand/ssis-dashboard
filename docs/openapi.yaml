# C1c: metadata/liveness/readiness implemented; remaining operations planned.
openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: ssis-dashboard read-only API
  version: 1.0.0-draft.1
  description: Stage C DRAFT. C1c implements metadata/liveness/readiness; remaining resources are planned. API_CONTRACT.md defines local access, semantic
    validation, cursor and cross-field rules. No production/shared authentication or stream implementation is claimed.
  license: {name: Apache-2.0, identifier: Apache-2.0}
servers:
- {url: /, description: Local application root. A future URL-prefix deployment must publish its actual application
    base.}
security: []
x-contract-status: draft
x-deferred-resources: [/api/v1/stream (phase 5; event/resume/resync schemas not defined here)]
paths:
  /api/v1/meta:
    get:
      operationId: getMeta
      summary: Non-secret API metadata and implemented capabilities
      description: Implemented in C1c; no catalog query. C2a/C2b execution sorts are advertised after validation.
      x-implementation-status: implemented
      x-milestone: C1c
      parameters: []
      responses:
        '200':
          description: Successful documented resource; empty visible collections remain successful.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetaResponse'}
              examples:
                synthetic: {$ref: '#/components/examples/MetaResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/folders:
    get:
      operationId: listFolders
      summary: Visible folders containing visible projects
      description: Implemented in C3a. Name/ID keyset pages retain SQL visibility and exclude folders without visible projects.
      x-implementation-status: implemented
      x-milestone: C3a
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/FolderSort'}
      - {$ref: '#/components/parameters/AscendingDirection'}
      responses:
        '200':
          description: Successful documented resource; empty visible collections remain successful.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FoldersResponse'}
              examples:
                synthetic: {$ref: '#/components/examples/FoldersResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '504': {$ref: '#/components/responses/DatabaseTimeout'}
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: Visible projects in one exact folder
      description: Implemented in C3a. Exact folder equality follows catalog collation; unknown/hidden/empty folder scopes return an empty page. Missing folder input returns 400.
      x-implementation-status: implemented
      x-milestone: C3a
      parameters:
      - {$ref: '#/components/parameters/RequiredFolder'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
